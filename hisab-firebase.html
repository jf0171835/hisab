<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আমার হিসাব</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#14302b;--mute:#62786f;--line:#dbe5e1;--inc:#0f8a5f;--exp:#c2410c;--acc:#14564a;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a17;--card:#17262a;--ink:#e6f1ed;--mute:#8fa8a0;--line:#26403b;--inc:#3ddc97;--exp:#ff8a5c;--acc:#3ddc97;--accink:#0f1a17}}
:root[data-theme="dark"]{--bg:#0f1a17;--card:#17262a;--ink:#e6f1ed;--mute:#8fa8a0;--line:#26403b;--inc:#3ddc97;--exp:#ff8a5c;--acc:#3ddc97;--accink:#0f1a17}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Kohinoor Bangla",system-ui,sans-serif;font-size:16px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.month{width:auto}
.bal{background:var(--acc);color:var(--accink);border-radius:18px;padding:20px}
.bal small{opacity:.85}
.bal .big{font-size:38px;font-weight:700;line-height:1.2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.two div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.two small{color:var(--mute);display:block}
.two b{font-size:20px}
.i b{color:var(--inc)}.e b{color:var(--exp)}
section{margin-top:18px}
h2{font-size:17px;margin:0 0 8px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600}
.seg button.on.in{background:var(--inc);color:#fff;border-color:var(--inc)}
.seg button.on.ex{background:var(--exp);color:#fff;border-color:var(--exp)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add{padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--accink);font-weight:700;cursor:pointer}
.cat{margin-bottom:8px}
.cat div{display:flex;justify-content:space-between;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--exp)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px}
li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li .t{flex:1;min-width:0}
li .t span{display:block;font-size:13px;color:var(--mute);overflow-wrap:anywhere}
li .a{font-weight:700;white-space:nowrap}
li.in .a{color:var(--inc)}li.ex .a{color:var(--exp)}
li button{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.empty{padding:18px;text-align:center;color:var(--mute)}
.hd{display:flex;gap:8px}
.lkb{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;cursor:pointer}
body.locked main{display:none}
body.locked{overflow:hidden}
.lkb{font-size:14px}
.lbox{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.lbox span{display:block}.lbox b{font-size:17px}.lbox small{display:block;color:var(--mute)}.lbox i{font-style:normal;font-size:28px;color:var(--mute)}
#sheet,#psheet,#dsheet{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden],#dsheet[hidden],[hidden]{display:none!important}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:88%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.shh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.shh h2{margin:0}.shh button{border:0;background:none;font-size:28px;line-height:1;color:var(--mute);cursor:pointer;padding:0 6px}
.sh ul{overflow-y:auto;margin:12px 16px 16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.tabs button{padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.d2{background:#2b4a7c;color:#fff}
.pl{cursor:pointer}.pl i{font-style:normal;font-size:24px;color:var(--mute)}
#dsum{padding:10px 16px 0;color:var(--mute)}
#dadd{margin:0 16px 16px}
#dq{margin:12px 16px 0}#dq label{color:var(--mute);font-size:14px}
.lnk2{background:none;border:0;color:var(--acc);text-align:left;padding:0;cursor:pointer;font-size:14px;font-weight:600}

#lock{display:none;position:fixed;inset:0;z-index:10;overflow-y:auto;background:linear-gradient(180deg,#d6c8f5 0%,#c4b1ed 55%,#b5a0e4 100%);color:#33236f}
body.locked #lock{display:block}
.scene{--cw:clamp(84px,27vw,120px);position:relative;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:460px;min-height:100%;margin:0 auto;padding:88px 26px 48px 12px;overflow:hidden;z-index:0}
.stage{position:relative;padding-bottom:78px}
.cloud{position:absolute;display:block;background:#fff8f3;border-radius:40px;box-shadow:inset -4px -6px 10px rgba(180,160,220,.3),0 6px 14px rgba(120,90,190,.18);animation:drift 14s ease-in-out infinite alternate}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%;box-shadow:inherit}
.c1{left:8px;top:34px;width:74px;height:26px}.c1:before{width:38px;height:38px;left:12px;top:-20px}.c1:after{width:28px;height:28px;left:40px;top:-12px}
.c2{right:84px;top:16px;width:64px;height:22px;animation-delay:-6s}.c2:before{width:32px;height:32px;left:10px;top:-16px}.c2:after{width:24px;height:24px;left:34px;top:-10px}
@keyframes drift{from{transform:translateX(-7px)}to{transform:translateX(11px)}}
@keyframes glow{from{opacity:.5}to{opacity:1}}
.lamp{position:absolute;right:6px;top:-4px;width:54px;height:118px;z-index:5}
.glow{animation:glow 3s ease-in-out infinite alternate}
.plat{position:absolute;left:-14%;right:-14%;bottom:-26px;height:140px;border-radius:50%;background:radial-gradient(ellipse at 50% 25%,#e6dcfb 0%,#d4c6f4 65%,#c9b9ef 100%);box-shadow:inset 0 6px 14px rgba(255,255,255,.45),0 -4px 14px rgba(110,80,190,.18);z-index:0}
.plant{position:absolute;z-index:1}
.pl-l{left:-8px;bottom:84px;width:64px}
.pl-r{right:-14px;bottom:46px;width:62px;z-index:3}
.wrap{position:relative;margin-left:calc(var(--cw) - 14px);z-index:2}
.wrap>svg{position:absolute}
.shelf{right:-36px;top:70px;width:64px;height:220px;z-index:0}
.girl{position:absolute;left:-2px;bottom:50px;width:calc(var(--cw) + 20px);height:auto;z-index:4;filter:drop-shadow(0 6px 6px rgba(80,50,150,.22))}
.box{position:relative;z-index:1;margin:0;padding:26px 18px 22px 30px;border:0;border-radius:30px;background:linear-gradient(160deg,#fffdfb,#f4eefc);box-shadow:0 20px 32px rgba(96,70,170,.3),inset 0 -6px 12px rgba(180,160,230,.28),inset 0 3px 6px #fff;display:flex;flex-direction:column;gap:12px;text-align:center}
.appic{width:76px;height:76px;align-self:center;filter:drop-shadow(0 8px 8px rgba(110,80,200,.35))}
.box h2{margin:2px 0 0;font-size:26px;font-weight:700;color:#33236f;line-height:1.3}
.box p{margin:-6px 0 4px;font-size:14px;color:#8f84b8}
.fld{display:flex;align-items:center;gap:10px;background:#f1ecfb;border-radius:999px;padding:0 14px;height:48px;box-shadow:inset 0 2px 5px rgba(150,130,200,.28),0 2px 0 #fff}
.fld:focus-within{box-shadow:inset 0 2px 5px rgba(150,130,200,.28),0 0 0 2px #a88cf0}
.fld>svg{flex:none;width:20px;height:20px;fill:#7b66c4}
.fld input,.fld input:focus-visible{flex:1;min-width:0;width:auto;height:100%;padding:0;border:0;border-radius:0;background:none;color:#33236f;font-size:15px;outline:none;box-shadow:none}
.fld input::placeholder{color:#a79bd0}
.eye{flex:none;border:0;background:none;padding:2px;cursor:pointer;color:#7b66c4;line-height:0}
.eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eye.show .sl{display:none}
.box .add{height:50px;padding:0;border:0;border-radius:999px;background:linear-gradient(180deg,#bba5f5,#9a81e6);color:#fff;font-size:17px;font-weight:700;box-shadow:0 8px 14px rgba(124,92,214,.4),inset 0 2px 3px rgba(255,255,255,.55);cursor:pointer}
.box .add:disabled{opacity:.7}
.lnk{background:none;border:0;padding:2px 0;cursor:pointer;font-size:14px;color:#6f58c4}
#fg{align-self:flex-end;margin-top:-4px;font-size:13px;font-weight:600;text-align:right}
#sw{color:#6e6399}#sw b{color:#6f58c4}
#sk{color:#8c80b4;text-decoration:underline}
#le{font-size:13px;color:#d0456f}#le:empty{display:none}
@media (prefers-reduced-motion:reduce){.cloud,.glow{animation:none}}
</style>
</head>

<main>
<header><h1>আমার হিসাব</h1><div class="hd"><input class="month" type="month" id="month" aria-label="মাস বাছাই করুন"><button type="button" id="lkset" class="lkb" aria-label="অ্যাপ লক">🔒</button><button type="button" id="lk" class="lkb" aria-label="লগ আউট">বের হন</button></div></header>
<div class="tabs"><button type="button" id="t1" class="on">আয়-ব্যয়</button><button type="button" id="t2">দেনা-পাওনা</button></div>
<div id="v1">

<div class="bal"><small>এই মাসের অবশিষ্ট</small><div class="big" id="bal">৳ ০</div></div>
<div class="two">
<div class="i"><small>মোট আয়</small><b id="inc">৳ ০</b></div>
<div class="e"><small>মোট ব্যয়</small><b id="exp">৳ ০</b></div>
</div>

<section>
<h2>নতুন হিসাব যোগ করুন</h2>
<form id="f">
<div class="seg"><button type="button" class="in on" id="bi">আয়</button><button type="button" class="ex" id="be">ব্যয়</button></div>

$("df").onsubmit=function(e){e.preventDefault();var a=parseFloat($("da").value),n=$("dn").value.trim().replace(/\s+/g," ");if(!(a>0)||!n||!dref)return;
 dref.push({name:n,kind:$("dk").value,amt:a,date:$("dd").value,note:$("dnote").value.trim(),ts:Date.now()});
 $("dn").value="";$("da").value="";$("dnote").value=""};
$("open").onclick=function(){$("sheet").hidden=false};
$("cl").onclick=function(){$("sheet").hidden=true};
$("sheet").onclick=function(e){if(e.target===this)this.hidden=true};

auth.onAuthStateChanged(function(u){
 if(uref){uref.off();uref=null}if(dref){dref.off();dref=null}
 if(u){curUser=u;

  dref.on("value",function(s){var v=s.val()||{};debts=Object.keys(v).map(function(k){var x=v[k];x.id=k;return x});renderD()},function(){$("plist").innerHTML='<div class="empty">ডাটা পড়তে সমস্যা হয়েছে</div>'});
  uref.on("value",function(s){var v=s.val()||{};data=Object.keys(v).map(function(k){var x=v[k];x.id=k;return x});render()},function(){$("list").innerHTML='<div class="empty">ডাটা পড়তে সমস্যা হয়েছে, ইন্টারনেট ও রুলস পরীক্ষা করুন</div>'});
 var lk=getLk();if(lk)showLock("unlock");else if(!skipped())showLock("setlock");else enter();
 }else{curUser=null;data=[];debts=[];render();renderD();showLock("login")}
});
